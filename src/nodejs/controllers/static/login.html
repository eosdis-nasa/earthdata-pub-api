<!doctype html>
<html>
<head>
  <title>Earthdata Pub Dev Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap">
</head>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    font-family: "Open Sans", Helvetica Neue, Helvetica, Arial, sans-serif;
    background: #b7b7b7;
    color: #1d242b;
  }
  #main {
    width: min(40rem, calc(100% - 2rem));
    margin: 4rem auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    overflow: hidden;
  }
  #banner {
    background: #2276ac;
    color: #fff;
    text-align: center;
    padding: 1.35rem 1.5rem 1.15rem;
  }
  #banner h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.3;
  }
  #banner p {
    margin: 0.3rem 0 0;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  #selector, #body, #footer {
    padding: 0 1.75rem;
  }
  #selector {
    padding-top: 1.35rem;
  }
  .field {
    display: grid;
    grid-template-columns: 9.5rem 1fr;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 0.85rem;
  }
  label {
    font-size: 0.95rem;
  }
  #user-select, .text-input {
    width: 100%;
    height: 2.25rem;
    padding: 0 0.6rem;
    border: 1px solid #b2b2b2;
    border-radius: 4px;
    font: inherit;
    color: inherit;
    background: #fff;
  }
  #user-select:focus, .text-input:focus {
    outline: 3px solid #000;
    outline-offset: 2px;
  }
  .lists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    align-items: start;
    margin-top: 0.4rem;
  }
  .lists h2 {
    margin: 0 0 0.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
  }
  ul {
    margin: 0;
    padding: 0.45rem 0.7rem;
    max-height: 26rem;
    overflow-y: auto;
    list-style: none;
    border: 1px solid #d5d5d5;
    border-radius: 4px;
    background: #fafafa;
  }
  li label {
    display: flex;
    align-items: flex-start;
    gap: 0.45rem;
    padding: 0.2rem 0;
    line-height: 1.3;
    cursor: pointer;
  }
  #user-info .field span {
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  #footer {
    display: flex;
    justify-content: center;
    padding: 1.25rem 1.75rem 1.75rem;
  }
  .button {
    min-width: 9rem;
    padding: 0.7rem 1.5rem;
    border: 0;
    border-radius: 4px;
    color: #fff;
    background: #2276ac;
    font: inherit;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }
  .button:hover {
    background: #1b628f;
  }
  .button:focus-visible {
    outline: 3px solid #000;
    outline-offset: 2px;
  }
</style>
<body>
<div id="main">
  <div id="banner" role="banner">
    <h1>Earthdata Pub</h1>
    <p>Local sign-in</p>
  </div>
  <div id="selector">
    <div class="field">
      <label for="user-select">Test user</label>
      <select id="user-select">
        <option value="register">Register new</option>
      </select>
    </div>
  </div>
  <div id="body">
    <div id="register" class="panel">
      <div class="field">
        <label for="input-name">Full name</label>
        <input type="text" id="input-name" class="text-input" name="name">
      </div>
      <div class="field">
        <label for="input-email">Email</label>
        <input type="email" id="input-email" class="text-input" name="email">
      </div>
      <div class="lists">
        <div>
          <h2 id="role-heading">Roles</h2>
          <ul id="role-list" aria-labelledby="role-heading"></ul>
        </div>
        <div>
          <h2 id="group-heading">Groups</h2>
          <ul id="group-list" aria-labelledby="group-heading"></ul>
        </div>
      </div>
    </div>
    <div id="user-info" class="panel">
      <div class="field">
        <span>User ID</span>
        <span id="user-info-id"></span>
      </div>
      <div class="field">
        <span>Full name</span>
        <span id="user-info-name"></span>
      </div>
    </div>
  </div>
  <div id="footer">
    <button type="button" id="btn-login" class="button">Sign in</button>
    <button type="button" id="btn-register" class="button">Register</button>
  </div>
</div>
  <script>
    const state = new URLSearchParams(window.location.search).get('state');
    const users = {};
    const groups = {};
    const roles = {};
    const userSelect = document.getElementById('user-select');
    const groupUList = document.getElementById('group-list');
    const roleUList = document.getElementById('role-list');
    const userInfoPanel = document.getElementById('user-info');
    const registerPanel = document.getElementById('register');
    const nameInput = document.getElementById('input-name');
    const emailInput = document.getElementById('input-email');
    const registerButton = document.getElementById('btn-register');
    const loginButton = document.getElementById('btn-login');
    const info = {
      id: document.getElementById('user-info-id'),
      name: document.getElementById('user-info-name')
    }
    userInfoPanel.style.display = "none";
    loginButton.style.display = "none";
    fetch('http://localhost:8080/auth/user_list')
    .then((res) => { return res.json(); })
    .then((userList) => {
      userList.forEach((user) => {
        users[user.id] = user;
        const option = document.createElement("option");
        option.value = user.id;
        option.text = user.name;
        userSelect.options.add(option);
      })
    });
    fetch('http://localhost:8080/auth/group_list')
    .then((res) => { return res.json(); })
    .then((groupList) => {
      groupList.forEach((group) => {
        const item = document.createElement("li");
        const label = document.createElement("label");
        const input = document.createElement("input");
        const text = document.createElement("text");
        input.type = "checkbox";
        text.textContent = group.long_name;
        label.appendChild(input);
        label.appendChild(text);
        item.append(label);
        groupUList.appendChild(item);
        groups[group.id] = input;
      });
    });
    fetch('http://localhost:8080/auth/role_list')
    .then((res) => { return res.json(); })
    .then((roleList) => {
      roleList.forEach((role) => {
        const item = document.createElement("li");
        const label = document.createElement("label");
        const input = document.createElement("input");
        const text = document.createElement("text");
        input.type = "checkbox";
        text.textContent = role.long_name;
        label.appendChild(input);
        label.appendChild(text);
        item.append(label);
        roleUList.appendChild(item);
        roles[role.id] = input
      });
    });

    function handleSelect(e) {
      const pick = e.target.value;
      if (pick === 'register') {
        registerPanel.style.display = "";
        registerButton.style.display = "";
        userInfoPanel.style.display = "none";
        loginButton.style.display = "none";
      } else {
        userInfoPanel.style.display = "";
        loginButton.style.display = "";
        registerPanel.style.display = "none";
        registerButton.style.display = "none";
        const user = users[pick];
        info.id.innerText = user.id;
        info.name.innerText = user.name;
      }
    }

    function handleLogin(e) {
      const id = userSelect.value;
      const user = users[id];
      user.new_user = false;
      login(user);
    }

    function handleRegister(e) {
      const user = {
        new_user: true,
        name: nameInput.value,
        email: emailInput.value,
        user_groups: Object.entries(groups).reduce((acc, [k, v]) => {
          if (v.checked) acc.push(k);
          return acc; }, []),
        user_roles: Object.entries(roles).reduce((acc, [k, v]) => {
          if (v.checked) acc.push(k);
          return acc; }, [])
      };
      login(user);
    }

    function login(payload) {
      payload.state = state;
      fetch('http://localhost:8080/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then((res) => { return res.json() })
      .then(data => {
        window.location.replace(data.redirect);
      })
      .catch((error) => {
        console.error('Error:', error);
      });
    }

    userSelect.addEventListener('change', handleSelect, false);
    registerButton.addEventListener('click', handleRegister, false);
    loginButton.addEventListener('click', handleLogin, false);
  </script>
</body>
</html>
